<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 460" width="670" height="460" role="img" aria-labelledby="title desc">
  <title id="title">Flexible linkage at release</title>
  <desc id="desc">Two Timoshenko links hang from a fixed base. Revolute joints connect nodes 2 and 3 at the base and nodes 4 and 5 at the elbow. A spring and a viscous damper run in parallel from fixed node 7 to the tip mass at node 6.</desc>
  <rect width="670" height="460" rx="12" fill="#fff"/>

  <g fill="#172b4d" font-family="sans-serif" font-size="15">
    <text x="28" y="37" font-size="22" font-weight="bold">Flexible linkage at release</text>
    <text x="305" y="66" text-anchor="middle">Fixed base stub (1–2)</text>
    <text x="383" y="110">Base revolute joint (2–3)</text>
    <text x="449" y="183">Timoshenko link 1</text>
    <text x="449" y="261">Elbow revolute joint (4–5)</text>
    <text x="449" y="328">Timoshenko link 2</text>
    <text x="418" y="399">Tip mass (6)</text>
    <text x="151" y="330" text-anchor="end">Fixed anchor (7)</text>
  </g>

  <g fill="none" stroke="#52647a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M281 84h49 M283 84l7-8 M296 84l7-8 M309 84l7-8 M322 84l7-8 M281 84v21 M330 84v21"/>
    <path d="M281 105h49" stroke-width="7"/>
    <path d="M171 325v18 M155 343h32 M156 351l7-8 M166 351l7-8 M176 351l7-8"/>
    <path d="M343 105h31 M379 178h61 M415 256h25 M409 323h31 M390 393h19"/>
  </g>

  <path d="M330 105L403 260 379 393" fill="none" stroke="#2165a7" stroke-width="9" stroke-linecap="round"/>

  <g transform="translate(171 325) rotate(18.1)">
    <g fill="none" stroke="#834625" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0h20v-24h37l7-9 12 18 12-18 12 18 12-18 12 18 12-18 12 18 7-9h44v24h20"/>
      <path d="M20 0v24h61 M81 12h54 M81 36h54 M135 12v24 M96 16v16 M96 24h-15 M135 24h64V0"/>
    </g>
    <g fill="#66371c" font-family="sans-serif" font-size="15" text-anchor="middle">
      <text x="106" y="-43">Follower spring</text>
      <text x="106" y="56">Viscous damper</text>
    </g>
  </g>

  <g fill="#fff" stroke="#172b4d" stroke-width="2.5">
    <circle cx="281" cy="105" r="4"/>
    <circle cx="330" cy="105" r="10"/>
    <circle cx="403" cy="260" r="10"/>
    <circle cx="171" cy="325" r="5"/>
    <rect x="369" y="383" width="20" height="20" rx="2" fill="#d7e8f8"/>
  </g>
</svg>
